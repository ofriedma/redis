# Redis Configuration with io_uring Enabled
# Example configuration for testing io_uring functionality

# Basic Redis settings
port 6379
bind 127.0.0.1
timeout 0
tcp-keepalive 300
daemonize no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""

# Database settings
databases 16
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir ./

# Memory settings
maxmemory-policy noeviction

# io_uring Configuration - ENABLED
uring-enabled yes

# Basic io_uring settings
uring-queue-depth 4096
uring-buffer-pool-size 16384
uring-buffer-size 16384

# Advanced io_uring features
uring-multishot-accept yes
uring-use-provided-buffers yes
uring-provided-buffer-count 8192
uring-use-registered-fds yes
uring-max-registered-fds 10000

# SQPOLL settings (disabled by default for stability)
uring-sqpoll no
uring-sqpoll-idle-ms 10
uring-sqpoll-cpu 0

# Network optimizations
tcp-backlog 511
tcp-nodelay no

# Client settings
maxclients 10000

# Security (optional)
# requirepass your_password_here

# Append only file (optional)
appendonly no
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency monitoring
latency-monitor-threshold 0

# Event notification
notify-keyspace-events ""

# Advanced config
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000
stream-node-max-bytes 4096
stream-node-max-entries 100
activerehashing yes
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60
hz 10
dynamic-hz yes
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes
